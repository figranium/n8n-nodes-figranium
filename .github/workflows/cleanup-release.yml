name: Remove failed v0.7.5 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-release.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove failed release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.6 --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release delete v0.7.5 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
