name: One-time n8n review fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-n8n-review.yml'

permissions:
  contents: write
  id-token: write

jobs:
  fix-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Apply n8n review fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('nodes/Figranium/Figranium.node.ts')
          text = path.read_text()
          old = """        options: [
          {
            name: 'Execute',
            value: 'execute',
            description: 'Run a saved task and return its result',
          },
          {
            name: 'Task Actions',
            value: 'task',
            description: 'Manage automation tasks (create, list, update, delete)',
          },
          {
            name: 'Browser',
            value: 'browser',
            description: 'Launch a managed browser session',
          },
          {
            name: 'Execution',
            value: 'execution',
            description: 'Inspect past execution records',
          },
          {
            name: 'Inspector',
            value: 'inspector',
            description: 'Highlight and inspect elements on an active browser session',
          },
          {
            name: 'Schedule',
            value: 'schedule',
            description: 'View and manage task schedules',
          },
        ],
        default: 'execute',
"""
          new = """        options: [
          {
            name: 'Browser',
            value: 'browser',
            description: 'Launch a managed browser session',
          },
          {
            name: 'Execute',
            value: 'execute',
            description: 'Run a saved task and return its result',
          },
          {
            name: 'Execution',
            value: 'execution',
            description: 'Inspect past execution records',
          },
          {
            name: 'Inspector',
            value: 'inspector',
            description: 'Highlight and inspect elements on an active browser session',
          },
          {
            name: 'Schedule',
            value: 'schedule',
            description: 'View and manage task schedules',
          },
          {
            name: 'Task Action',
            value: 'task',
            description: 'Manage automation tasks (create, list, update, delete)',
          },
        ],
        default: 'execute',
"""
          if old not in text:
              raise SystemExit('Expected resource options block not found; refusing to edit')
          path.write_text(text.replace(old, new, 1))

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Commit, tag, and push
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-n8n-review.yml
          git add nodes/Figranium/Figranium.node.ts package.json package-lock.json .github/workflows/fix-n8n-review.yml
          git commit -m "fix: address n8n review feedback"
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --generate-notes
