name: One-time n8n review fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply n8n lint fixes
        run: npm run lintfix

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/Figranium/Figranium.node.ts package.json package-lock.json
          git commit -m "fix: address n8n review feedback"
          git push origin main
