name: One-time n8n review fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply requested n8n review fixes
        env:
          OLD_BLOCK: ""
          NEW_BLOCK: ""
        run: python -c "import os,base64,pathlib; p=pathlib.Path('nodes/Figranium/Figranium.node.ts'); s=p.read_text(); o=base64.b64decode(os.environ['OLD_BLOCK']).decode(); n=base64.b64decode(os.environ['NEW_BLOCK']).decode(); assert o in s, 'expected resource block not found'; p.write_text(s.replace(o,n,1))"

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/Figranium/Figranium.node.ts package.json package-lock.json
          git commit -m "fix: address n8n review feedback"
          git push origin main
