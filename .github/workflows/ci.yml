name: Validate n8n community node

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check actual package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node - "$RUNNER_TEMP/pack.json" <<'NODE'
          const fs = require('node:fs');
          const files = new Set(JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0].files.map((file) => file.path));
          for (const path of ['dist/index.js', 'dist/nodes/Figranium/Figranium.node.js', 'dist/credentials/FigraniumApi.credentials.js']) {
            if (!files.has(path)) throw new Error(`Missing packaged file: ${path}`);
          }
          NODE

      - name: Verify published npm package provenance
        run: npx --yes @n8n/scan-community-package n8n-nodes-figranium
