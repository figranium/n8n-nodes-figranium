name: Publish to npm with Provenance

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Apply n8n review fix
        if: false
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nodes/Figranium/Figranium.node.ts')
          s = p.read_text()
          s = s.replace("import { NodeOperationError } from 'n8n-workflow';", "import { NodeConnectionTypes, NodeOperationError } from 'n8n-workflow';")
          s = s.replace("inputs: ['main'],", "inputs: [NodeConnectionTypes.Main],")
          s = s.replace("outputs: ['main'],", "outputs: [NodeConnectionTypes.Main],")
          p.write_text(s)
          PY

      - name: Run validation
        run: |
          npm run build
          npx @n8n/scan-community-package n8n-nodes-figranium

      - name: Persist review fix
        if: false
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nodes/Figranium/Figranium.node.ts package.json package-lock.json
          git commit -m 'fix: satisfy n8n community package review'
          git push

      - name: Check whether version is already published
        id: npm_version
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is already published; skipping duplicate publish."
          fi

      - name: Publish to npm with Provenance
        if: steps.npm_version.outputs.already_published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
