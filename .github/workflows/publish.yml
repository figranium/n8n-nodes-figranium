name: Publish to npm with Provenance

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Apply n8n review fix and bump patch version
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nodes/Figranium/Figranium.node.ts')
          s = p.read_text()
          s = s.replace("import { NodeOperationError } from 'n8n-workflow';", "import { NodeConnectionTypes, NodeOperationError } from 'n8n-workflow';")
          s = s.replace("inputs: ['main'],", "inputs: [NodeConnectionTypes.Main],")
          s = s.replace("outputs: ['main'],", "outputs: [NodeConnectionTypes.Main],")
          p.write_text(s)
          PY
          npm version patch --no-git-tag-version

      - name: Run validation
        run: |
          npm run build
          npm run lint
          npx @n8n/scan-community-package n8n-nodes-figranium

      - name: Persist review fix
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nodes/Figranium/Figranium.node.ts package.json package-lock.json
          git commit -m 'fix: satisfy n8n community package review'
          git push

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
