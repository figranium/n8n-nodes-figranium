name: Fix n8n Browser and Inspector removal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-remove-nodes.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Remove Browser and Inspector resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nodes/Figranium/Figranium.node.ts')
          s = p.read_text()
          def cut(start, end):
              global s
              a=s.index(start); b=s.index(end,a); s=s[:a]+s[b:]
          # Selector entries
          for block in [
          "          {\n            name: 'Browser',\n            value: 'browser',\n            description: 'Launch a managed browser session',\n          },\n",
          "          {\n            name: 'Inspector',\n            value: 'inspector',\n            description: 'Highlight and inspect elements on an active browser session',\n          },\n"]:
              if block not in s: raise SystemExit('Expected selector block missing')
              s=s.replace(block,'',1)
          # Whole UI sections, using stable comment boundaries
          cut('      // ─── BROWSER operations', '      // ─── Shared: Task ID')
          cut('      // ─── Browser: Open', '    ],\n  };')
          # Runtime branches through the final fallback, preserving fallback
          cut('      // ── BROWSER', '      } else {\n        throw new NodeOperationError(this.getNode(), `Unsupported resource: ${resource}`, { itemIndex: i });')
          banned=["value: 'browser'","value: 'inspector'","resource: ['browser']","resource: ['inspector']","resource === 'browser'","resource === 'inspector'",'/api/browser/open','/api/inspector/highlight','browserUrl','inspectorUrl','targetHint','sessionId']
          left=[x for x in banned if x in s]
          if left: raise SystemExit(f'Leftovers: {left}')
          p.write_text(s)
          PY
      - name: Bump version
        run: npm version patch --no-git-tag-version
      - name: Verify
        run: |
          npm run build
          npm run lint
      - name: Commit clean source
        run: |
          rm .github/workflows/fix-remove-nodes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove browser and inspector resources from n8n node"
          git push
      - name: Publish npm package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
