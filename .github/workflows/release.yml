name: Create GitHub Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.4.0)
        required: true
        type: string
      notes:
        description: Human-curated release notes
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create one-time release tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
      - name: Tag v0.7.5
        if: github.event_name == 'push'
        run: |
          test "$(node -p "require('./package.json').version")" = '0.7.5'
          git tag v0.7.5
          git push origin refs/tags/v0.7.5
      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.7.5' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || 'v0.7.5' }}

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag || 'v0.7.5' }}
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match package version $EXPECTED"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.7.5' }}
          NOTES: ${{ inputs.notes || 'Default new connections to Figranium Cloud; self-hosted URLs remain supported.' }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || 'v0.7.5' }}
    secrets: inherit
